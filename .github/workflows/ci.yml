# Сборка и самопроверка кубика (--shot) на каждый push и pull request
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build native -c Release -o out
      - name: Self-check
        shell: bash
        run: |
          ./out/PokerDice.exe --shot shot | tee check.log
          ! grep -q FAIL check.log
          grep -q '^ok' check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shot/
